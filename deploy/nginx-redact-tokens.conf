# Keep secret link tokens (manage/confirm/delete/feedback/unsubscribe) out of nginx access logs.
# Install: sudo cp deploy/nginx-redact-tokens.conf /etc/nginx/conf.d/webzap-jobs-redact.conf
# then use `access_log /var/log/nginx/access.log redacted if=$webzap_loggable;` in the site's server blocks
# (see nginx.conf.example).
map $request_uri $redacted_uri {
    "~^/(?<route>manage|confirm|delete|feedback|unsubscribe)/"  "/$route/[token]";
    default                                                     $request_uri;
}
# Clicks on links in our emails (/go) are counted anonymously by the app – so they are not logged here at all:
# an access log line would tie an IP address to a click.
map $request_uri $webzap_loggable {
    "~^/(es/|fr/|de/|en/)?go(\?|$)"  0;
    default                          1;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $redacted_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';
