# Keep secret link tokens (manage/confirm/delete/feedback/unsubscribe) out of nginx access logs.
# Install: sudo cp deploy/nginx-redact-tokens.conf /etc/nginx/conf.d/webzap-jobs-redact.conf
# then use `access_log /var/log/nginx/access.log redacted;` in the site's server blocks (see nginx.conf.example).
map $request_uri $redacted_uri {
    "~^/(?<route>manage|confirm|delete|feedback|unsubscribe)/"  "/$route/[token]";
    default                                                     $request_uri;
}
log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $redacted_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';
