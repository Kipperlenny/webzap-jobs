# Job sites we can't search automatically: no open interface for a service like ours, or terms that don't allow it.
# Public and generic – no personal data here. Read by web/external.py.
#
# Instead of leaving them out silently, the digest may add up to `max_per_email` of them as clearly labelled external
# links, with a search already filled in for the person (their role, and their place where the site supports it).
# Rules, so this never turns into mass mailing:
#   - only in an email that is sent anyway – never an email just for these links;
#   - only sites that fit the person: their country, their field, their kind of work, a language they speak;
#   - the same link at most once every `repeat_days`.
#
# Each [[site]]:
#   name, id       shown name and a stable id
#   search         URL with {q} (URL-encoded query) or {q_slug} (engineering-manager); optional {where}/{where_slug}
#   search_where   optional: the same, with a place – used when the person named one
#   countries      the person must want to work in one of these (English names); empty = anywhere
#   topics         at least one must appear in their roles, fields, skills or keywords; empty = any field
#   types          their employment types must include one of these; empty = any
#   languages      they must speak one of these (from their text or their email language); empty = any
# Every URL here was checked by hand to open a real result page.

[settings]
max_per_email = 2
repeat_days = 30

# ---- country job boards ----

[[site]]
id = "stepstone-de"
name = "StepStone"
search = "https://www.stepstone.de/jobs/{q_slug}"
search_where = "https://www.stepstone.de/jobs/{q_slug}/in-{where_slug}"
countries = ["germany"]
languages = ["german"]

