[index]
headline = 'Sag uns, welchen Job du <span class="c">wirklich</span> willst.'
lead = "WebZap Jobs durchsucht jeden Tag Tausende offene Stellen und schickt dir per E-Mail nur die, die zu dem passen, was du geschrieben hast. Kein Profil zum Ausfüllen, kein Konto, kein Lebenslauf-Upload. Nur deine eigenen Worte."
cta = "beschreib deinen Job ↓"
trust = 'kostenlos &amp; Open Source – <a href="#code">lies nach, was wir mit deinen Daten machen</a> · <a href="{sample}">sieh dir eine Beispiel-E-Mail an</a>'
promise_big = "Das hier ist <em>100 % kostenlos</em>. Dein Text wird für genau eine Sache verwendet: <em>dir passende Jobangebote per E-Mail zu schicken</em>."
promise = "Wir verkaufen deine Daten nie und geben sie nie weiter – es ist eine Einbahnstraße. Damit das kostenlos bleibt, können Unternehmen uns dafür bezahlen, ihren Job in unsere E-Mails aufzunehmen, und manche Joblinks führen zu Partner-Jobsuchmaschinen, die uns pro Klick bezahlen. Beides ist immer klar gekennzeichnet („Gesponsert“, „Partnerlink“), und keiner von beiden bekommt jemals deine E-Mail-Adresse oder das, was du geschrieben hast. Jede E-Mail enthält einen Link, um die Häufigkeit zu ändern, zu pausieren oder alles zu löschen – ein Klick, jederzeit."
pills = ["für immer kostenlos", "kein Konto", "keine Cookies", "verschlüsselt gespeichert", "Open Source"]
term_title = "neue Suche"
wish_label = "Ich möchte …"
wish_placeholder = "… als Senior Marketing Manager für eine nachhaltige Konsumgütermarke arbeiten. Letzte Position: Marketing Lead bei einem Food-Start-up, Team von 4 Leuten. Ich liebe Markenstrategie und Content, Paid Ads eher weniger. Wohne in Hamburg, offen für Remote, reise gern ab und zu. Gehalt um die 70k. Kein Interesse an Agenturjobs …"
wish_hint = "Nenn dein Fachgebiet, deine Interessen, deine letzte Position, wo du wohnst, ob remote oder nicht, deine Gehaltsvorstellung, was du <em>nicht</em> willst – alles, was dir durch den Kopf geht. Jede Sprache ist okay. Einfach drauflos schreiben!"
warn = "<strong>Gib weder deinen Namen noch andere persönliche Angaben ein</strong> (Telefon, Adresse, Arbeitgeber, die privat bleiben sollen, Gesundheit usw.). Wir brauchen nur das, was dein Ziel bei der Jobsuche beschreibt."
email_label = "E-Mail"
email_hint = "Wird nur verwendet, um dir passende Jobs und die Links zur Verwaltung deines Eintrags zu schicken."
freq_label = "wie oft?"
honeypot = "Dieses Feld leer lassen"
consent = 'Ich bin einverstanden, dass meine E-Mail-Adresse und mein Text gespeichert werden, um mir passende Jobs zu schicken (darunter können klar gekennzeichnete gesponserte Jobs und Partnerlinks sein) – wie in der <a href="{privacy}">Datenschutzerklärung</a> beschrieben. Ich kann alles jederzeit ändern oder löschen.'
submit = "schick mir den Bestätigungslink →"

[index.how]
title = "so funktioniert’s"
describe = "beschreiben"
describe_text = "Schreib frei, was du suchst. Unordentlich ist völlig okay."
