wish_hint = "Mention your field, your interests, your last position, where you're based, remote or not, salary expectations, what you <em>don't</em> want – everything in your head. Any language is fine. Brainstorm it!"
warn = "<strong>Don't enter your name or other personal details</strong> (phone, address, employer names you want to keep private, health, etc.). We only need what describes your job search intent."
