promise = "We never sell or share your data – it's a one-way street. To keep this free, companies can pay us to include their job in our emails, and some job links go to partner job search engines that pay us per click. Both are always clearly labelled (“Sponsored”, “Partner link”), and neither ever gets your email address or what you wrote. Every email has a link to change the frequency, pause, or delete everything – one click, any time."
pills = ["free forever", "no account", "no cookies", "encrypted at rest", "open source"]
term_title = "new search"
