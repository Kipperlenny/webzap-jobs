# Spanish strings (Spain). The UI addresses users with "tú"; the legal pages use a formal register.
# Labels quoted in legal/privacy.es.html («Quiero…», «Patrocinado», «Enlace de colaborador», «en pausa»,
# «esta empresa no», «demasiado júnior», «ubicación incorrecta») must stay identical here.

