# Chaînes françaises – mêmes clés et mêmes {placeholders} que en.toml.

[meta]
title = "WebZap Jobs – décrivez l'emploi que vous voulez"
description = "Décrivez avec vos propres mots l'emploi que vous voulez. Recevez par e-mail uniquement les offres ouvertes qui correspondent. Gratuit, open source, sans compte, sans pistage."
suffix = "WebZap Jobs"

[nav]
