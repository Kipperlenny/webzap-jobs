[index]
headline = "Dites-nous quel emploi vous voulez <span class=\"c\">vraiment</span>."
lead = "Chaque jour, WebZap Jobs passe en revue des milliers d'offres ouvertes et ne vous envoie par e-mail que celles qui correspondent à ce que vous avez écrit. Pas de profil à remplir, pas de compte, pas de CV à télécharger. Juste vos propres mots."
cta = "décrivez votre emploi ↓"
trust = "gratuit &amp; open source – <a href=\"#code\">découvrez ce que nous faisons de vos données</a> · <a href=\"{sample}\">voir un exemple d'e-mail</a>"
promise_big = "C'est <em>100 % gratuit</em>. Votre texte sert à une seule chose : <em>vous envoyer par e-mail des offres d'emploi sur mesure</em>."
promise = "Nous ne vendons ni ne partageons jamais vos données – c'est à sens unique. Pour que le service reste gratuit, des entreprises peuvent nous payer pour inclure leur offre dans nos e-mails, et certains liens mènent à des moteurs de recherche d'emploi partenaires qui nous rémunèrent au clic. Les deux sont toujours clairement signalés (« Sponsorisé », « Lien partenaire »), et aucun d'eux ne reçoit jamais votre adresse e-mail ni ce que vous avez écrit. Chaque e-mail contient un lien pour changer la fréquence, mettre en pause ou tout supprimer – en un clic, à tout moment."
pills = ["gratuit pour toujours", "sans compte", "sans cookies", "stockage chiffré", "open source"]
term_title = "nouvelle recherche"
wish_label = "Je veux…"
wish_placeholder = "…travailler comme senior marketing manager pour une marque de consommation durable. Dernier poste : responsable marketing dans une start-up alimentaire, équipe de 4 personnes. J'adore la stratégie de marque et le contenu, moins la publicité payante. Basée à Hambourg, ouverte au télétravail, d'accord pour voyager de temps en temps. Salaire autour de 70 k. Les agences ne m'intéressent pas…"
wish_hint = "Indiquez votre domaine, vos centres d'intérêt, votre dernier poste, où vous vivez, télétravail ou non, vos prétentions salariales, ce que vous <em>ne</em> voulez <em>pas</em> – tout ce qui vous passe par la tête. Toutes les langues sont acceptées. Lâchez-vous !"
warn = "<strong>N'indiquez pas votre nom ni d'autres données personnelles</strong> (téléphone, adresse, noms d'employeurs que vous souhaitez garder confidentiels, santé, etc.). Nous avons seulement besoin de ce qui décrit votre recherche d'emploi."
email_label = "e-mail"
email_hint = "Sert uniquement à vous envoyer des offres correspondantes et les liens pour gérer votre inscription."
freq_label = "à quelle fréquence ?"
honeypot = "Laissez ce champ vide"
consent = "J'accepte que mon adresse e-mail et mon texte soient enregistrés pour m'envoyer des offres correspondantes (pouvant inclure des offres sponsorisées et des liens partenaires clairement signalés), et que les ouvertures et clics de ces e-mails soient comptés afin de supprimer les abonnés inactifs – comme décrit dans la <a href=\"{privacy}\">politique de confidentialité</a>. Je peux tout modifier ou supprimer à tout moment."
submit = "envoyez-moi le lien de confirmation →"

[index.how]
title = "comment ça marche"
describe = "décrire"
describe_text = "Écrivez librement ce que vous cherchez. Pas besoin que ce soit bien rangé."
confirm = "confirmer"
confirm_text = "Cliquez sur le lien de l'e-mail que nous vous envoyons. Les inscriptions non confirmées disparaissent au bout de 48 h."
receive = "recevoir"
receive_text = "Recevez les offres ouvertes qui correspondent, chaque jour ou chaque semaine. Uniquement des annonces réelles et actuelles. <a href=\"{sample}\">Voir un exemple →</a>"
control = "contrôler"
control_text = "Pas de compte, pas de mot de passe. Chaque e-mail contient vos liens personnels pour modifier, mettre en pause, exporter ou supprimer."

[index.code]
title = "ne nous croyez pas sur parole – lisez le code"
big = "WebZap Jobs est <em>open source</em>. Tout ce que ce site fait de vos données est public sur GitHub."
small = "Les promesses de confidentialité ne coûtent rien. Le code, lui, se vérifie. Lisez-le, auditez-le, hébergez votre propre instance, ou ouvrez une issue si quelque chose ne vous plaît pas."
facts = [
  "licence MIT",
  "e-mail + texte chiffrés (Fernet/AES)",
  "liens stockés uniquement sous forme de hachés SHA-256",
  "zéro cookie, zéro traceur",
  "aucune police ni aucun script tiers",
  "commit déployé affiché en pied de page",
]
caption = "↑ la vraie fonction qui enregistre votre inscription, lue depuis le code en cours d'exécution"
view = "voir le code source sur github →"
inspect = "inspecter le commit déployé {commit}"

